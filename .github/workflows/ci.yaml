name: CI Pipeline

on: push

jobs:
  project-testing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.12'

      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('flask_app/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install --upgrade pip setuptools
          pip install torch==2.12.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r flask_app/requirements.txt

      - name: Download NLTK data
        run: |
          python -m nltk.downloader stopwords wordnet

      - name: Run Flask app tests
        if: success()
        env:
          CAPSTONE_PROJECT: ${{ secrets.CAPSTONE_PROJECT }}
        run: python -m unittest tests/test_flask_app.py

  docker-build-push:
    runs-on: ubuntu-latest
    needs: project-testing        # only runs if tests pass
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/cfpb-app:latest .

      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/cfpb-app:latest